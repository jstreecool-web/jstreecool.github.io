<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>St Gallen M&amp;A Seminar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a single index column listing each case with its language versions */
:root {
  --bg: #f6f6f3; --paper: #ffffff; --ink: #1b2130; --ink-2: #4d5566; --rule: #dcdcd4; --accent: #184f95;
  --display: "Noto Serif SC", "Songti SC", serif;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #15171c; --paper: #1d2027; --ink: #ecebe6; --ink-2: #b4b6bd; --rule: #343843; --accent: #86b6ef; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg: #15171c; --paper: #1d2027; --ink: #ecebe6; --ink-2: #b4b6bd; --rule: #343843; --accent: #86b6ef; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.7; }
main { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; }
header { border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: 24px; }
h1 { font-family: var(--display); font-size: 34px; margin: 0 0 6px; text-wrap: balance; }
.sub { color: var(--ink-2); margin: 0; }
.case { background: var(--paper); border: 1px solid var(--rule); padding: 20px 24px; display: grid; gap: 6px; }
.case h2 { font-family: var(--display); font-size: 21px; margin: 0; text-wrap: balance; }
.case p { margin: 0; color: var(--ink-2); font-size: 15px; }
.links { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.links a { color: var(--accent); font-weight: 700; text-decoration: none; border: 1px solid var(--accent); padding: 4px 14px; }
.links a:hover, .links a:focus-visible { background: var(--accent); color: var(--paper); outline: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>St Gallen M&amp;A Seminar</h1>
    <p class="sub">Case analyses · 案例分析</p>
  </header>
  <article class="case">
    <h2>ABN AMRO (2007): the battle for control · 控制权争夺战</h2>
    <p>Barclays vs the RBS / Santander / Fortis consortium: competitive position, TCI's activist letter, the two offers, board composition and leadership roles.</p>
    <div class="links">
      <a href="abn-amro-2007/en.html" hreflang="en">English</a>
      <a href="abn-amro-2007/index.html" hreflang="zh-CN">中文</a>
    </div>
  </article>
</main>
</body>
</html>
