<style>
/* Layout idea: a control room. Assumptions on the left, the map in the middle, the ranked answer on the right, evidence in tabs underneath. */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#13202b; --ink2:#4b5a67; --ink3:#7b8894; --line:#dde3e8; --sea:#e6ecf0; --land:#fbfcfc; --landline:#c3ccd4;
  --accent:#0d5c75; --accent-soft:#dcebf0;
  --good:#1d7f4d; --good-bg:#e0f2e7; --warn:#9a6400; --warn-bg:#fbefd3; --bad:#b3342f; --bad-bg:#fae3e1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --seq1:#fde3d3; --seq2:#f6b089; --seq3:#eb6834; --seq4:#a83f14; --seq5:#6a2408;
  --div-lo:#1b8f8f; --div-mid:#b9c0c6; --div-hi:#d9632a;
  --display:"IBM Plex Sans Condensed","Arial Narrow","PingFang SC","Microsoft YaHei","Noto Sans SC",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#10161b; --panel:#182129; --ink:#e8eef2; --ink2:#aebbc6; --ink3:#7f8d99; --line:#2a3742; --sea:#0f1920; --land:#1f2b35; --landline:#3a4a57;
  --accent:#5fb6d1; --accent-soft:#17323c;
  --good:#5ecb8e; --good-bg:#143524; --warn:#e8b54a; --warn-bg:#3a2c0c; --bad:#f08a84; --bad-bg:#431a18;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --seq1:#4a2412; --seq2:#8a3a15; --seq3:#d95926; --seq4:#f09363; --seq5:#fbd0b8;
  --div-lo:#35b3b3; --div-mid:#5a6772; --div-hi:#e87a45; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#10161b; --panel:#182129; --ink:#e8eef2; --ink2:#aebbc6; --ink3:#7f8d99; --line:#2a3742; --sea:#0f1920; --land:#1f2b35; --landline:#3a4a57;
  --accent:#5fb6d1; --accent-soft:#17323c;
  --good:#5ecb8e; --good-bg:#143524; --warn:#e8b54a; --warn-bg:#3a2c0c; --bad:#f08a84; --bad-bg:#431a18;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --seq1:#4a2412; --seq2:#8a3a15; --seq3:#d95926; --seq4:#f09363; --seq5:#fbd0b8;
  --div-lo:#35b3b3; --div-mid:#5a6772; --div-hi:#e87a45; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:24px} h2{font-size:17px} h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1560px;margin:0 auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-start;justify-content:space-between}
header.top p{color:var(--ink2);max-width:75ch}
.topright{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.verdict{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 14px;font-size:15px}
.verdict b{font-weight:600}
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,600px);gap:14px;align-items:start}
@media (max-width:1380px){.grid{grid-template-columns:250px minmax(0,1fr)} .grid .rank{grid-column:1 / -1}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--ink2)} .small{font-size:12px} .faint{color:var(--ink3)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.ctl label{font-size:13px} .ctl output{text-align:right;font-weight:500;white-space:nowrap}
.ctl input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--accent);margin:0 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip:hover{border-color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.mapbox{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sea);touch-action:none}
.mapbox svg{display:block;width:100%;height:auto;cursor:grab;user-select:none}
.mapbox svg.drag{cursor:grabbing}
.country{fill:var(--land);stroke:var(--landline);stroke-width:.6;vector-effect:non-scaling-stroke}
.link{stroke:var(--s1);stroke-width:1.6;vector-effect:non-scaling-stroke;fill:none;opacity:.75;stroke-dasharray:5 3}
.citylabel{font:600 12px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.sublabel{font:500 10.5px var(--body);fill:var(--ink2);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.cityg{cursor:pointer}
.cityg.sel .ring{stroke:var(--ink);stroke-width:2.5}
.zoom{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:4px;font-size:16px;line-height:1}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ramp{display:inline-flex;vertical-align:-2px;margin:0 5px}.ramp i{width:16px;height:10px;display:block}
.layerdesc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 16px;font-size:12.5px;color:var(--ink2)}
.layerdesc div{border-left:2px solid var(--line);padding-left:8px}
.layerdesc div.on{border-left-color:var(--accent)}
.layerdesc b{color:var(--ink);font-weight:600;display:block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--ink2);text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--accent-soft)} tbody tr.sel{background:var(--accent-soft)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.go{background:var(--good-bg);color:var(--good)} .pill.cond{background:var(--warn-bg);color:var(--warn)} .pill.no{background:var(--bad-bg);color:var(--bad)}
.est{color:var(--ink3);font-size:11px;margin-right:1px}
.scorebar{position:relative;height:14px;width:96px;background:var(--bg);border-radius:3px;display:inline-block;vertical-align:middle}
.scorebar i{position:absolute;left:0;top:2px;bottom:2px;background:var(--accent);border-radius:0 3px 3px 0}
.scorebar b{position:absolute;top:6px;height:2px;background:var(--ink)}
.scorebar b::before,.scorebar b::after{content:"";position:absolute;top:-3px;width:2px;height:8px;background:var(--ink)}
.scorebar b::before{left:0}.scorebar b::after{right:0}
.cellbar{display:inline-block;height:8px;border-radius:0 3px 3px 0;background:var(--s1);vertical-align:middle;margin-right:6px}
.mini{display:inline-flex;gap:2px;vertical-align:middle}
.mini span{width:22px;text-align:center;font-size:11px;border-radius:2px;padding:1px 0;color:var(--ink)}
#ranktable td,#ranktable th{padding-left:5px;padding-right:5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabpane{display:none;flex-direction:column;gap:12px}.tabpane.on{display:flex}
.note{font-size:12.5px;color:var(--ink2);max-width:95ch}
footer.credit{border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 24px;justify-content:space-between}
footer.credit p{margin:0;max-width:95ch} footer.credit a{color:var(--accent)}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv{border-left:2px solid var(--line);padding-left:8px}.kv>span{display:block;font-size:11.5px;color:var(--ink2)}.kv b{font-size:16px;font-weight:600}
.riskrow{display:flex;gap:10px;flex-wrap:wrap}
.tco{display:grid;grid-template-columns:96px minmax(0,1fr) 78px;gap:5px 8px;align-items:center;font-size:13px}
.tco .bar{display:flex;gap:2px;height:16px}
.tco .bar i{display:block;height:100%}
.tco .bar i:last-child{border-radius:0 4px 4px 0}
.heat td{text-align:center;padding:5px 6px;border:2px solid var(--panel)}
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.scard{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.scard.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.scard p{font-size:13px;color:var(--ink2)}
.scard ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.scard .asm{font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:8px}
.scell{display:inline-flex;gap:6px;align-items:center;justify-content:flex-end}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--panel);padding:7px 9px;border-radius:4px;font-size:12px;line-height:1.4;max-width:260px;z-index:9;display:none}
#tip b{font-weight:600}
ul.src{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;max-width:110ch}
a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.scorebar i,.tco .bar i{transition:width .25s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1 id="h-title"></h1><p id="h-sub"></p></div>
    <div class="topright">
      <div class="chips" id="langs" role="group" aria-label="Language"><button class="chip" data-l="en">English</button><button class="chip" data-l="zh">中文</button></div>
      <div class="small muted" id="h-asof"></div>
    </div>
  </header>
  <div class="verdict" id="verdict"></div>

  <div class="grid">
    <section class="panel" id="controls"></section>

    <section class="panel">
      <div class="row between"><h2 id="h-map"></h2><div class="chips" id="layers"></div></div>
      <div class="mapbox"><svg id="map" role="img" aria-label="Map of Europe"></svg>
        <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zreset" aria-label="Reset view">⌂</button></div></div>
      <div class="legend" id="maplegend"></div>
      <div class="layerdesc" id="layerdesc"></div>
      <div id="detail"></div>
    </section>

    <section class="panel rank">
      <div class="row between"><h2 id="h-rank"></h2><span class="small muted" id="h-rankhint"></span></div>
      <div class="tablewrap"><table id="ranktable"></table></div>
      <p class="note" id="ranknote"></p>
    </section>
  </div>

  <section class="panel">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tabpane" id="t-scen"></div>
    <div class="tabpane" id="t-cn"></div>
    <div class="tabpane" id="t-power"></div>
    <div class="tabpane" id="t-network"></div>
    <div class="tabpane" id="t-demand"></div>
    <div class="tabpane" id="t-cost"></div>
    <div class="tabpane" id="t-sources"></div>
  </section>
  <footer class="credit"><p id="f-credit"></p><p id="f-license"></p></footer>
</div>
<div id="tip"></div>

function km(a,b){const R=6371,r=Math.PI/180,[x1,y1]=GEO.ll[a],[x2,y2]=GEO.ll[b];
  const h=Math.sin((y2-y1)*r/2)**2+Math.cos(y1*r)*Math.cos(y2*r)*Math.sin((x2-x1)*r/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function rtt(a,b){return a===b?0:2*km(a,b)*ROUTE_FACTOR/FIBRE_KM_PER_MS;}
function meanRtt(n){const o=HUBS.filter(h=>h!==n);return o.reduce((s,h)=>s+rtt(n,h),0)/o.length;}
function tco(c,p){ // euros, for p.mw of IT load over 10 years, opex discounted
  const kw=p.mw*1000, build=c.build*p.fx*(1+AI_PREMIUM)*1e6*p.mw, land=c.land*1e6*p.mw;
  const price=c.price*(1+p.shock/100), energyYr=kw*c.pue*8760*(p.util/100)*price, otherYr=build*OTHER_OPEX;
  let af=0;for(let t=1;t<=YEARS;t++)af+=1/Math.pow(1+p.disc/100,t);
  const energy=energyYr*af, other=otherYr*af, total=build+land+energy+other;
  const crf=p.disc?(p.disc/100)/(1-Math.pow(1+p.disc/100,-YEARS)):1/YEARS;
  return {build,land,energy,other,total,energyYr,perKwMonth:((build+land)*crf+energyYr+otherYr)/kw/12};
}
function norm(vals,lowerBetter,log){const v=log?vals.map(x=>Math.log(x)):vals,mn=Math.min(...v),mx=Math.max(...v);

function scoreAll(cities,p){

  const nPeak=norm(col(c=>c.peak),0,1), nMem=norm(col(c=>c.mem),0,1), nRtt=norm(col(c=>meanRtt(c.n)),1);
  const nPop=norm(col(c=>c.pop),0,1), nMw=norm(col(c=>c.mw),0,1), nVac=norm(col(c=>c.vac),1), nAi=norm(col(c=>c.ai),0);
  const t=cities.map(c=>tco(c,p)), nCost=norm(t.map(x=>x.total),1);
  const nRisk=norm(col(c=>(c.reg+c.env+c.geo+c.soc)/4),1), nCn=norm(col(c=>c.cn),1);
  const ws=CRIT.reduce((s,[k])=>s+p.w[k],0)||1;
  return cities.map((c,i)=>{const s={power:.55*nWait[i]+.25*nCarb[i]+.20*nSaidi[i],network:.35*nPeak[i]+.25*nMem[i]+.40*nRtt[i],
    demand:.25*nPop[i]+.25*nMw[i]+.20*nVac[i]+.30*nAi[i],cost:nCost[i],risk:nRisk[i],access:nCn[i]};
    return {c,s,tco:t[i],score:CRIT.reduce((a,[k])=>a+s[k]*p.w[k],0)/ws};});
}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function simulate(p,runs=400){
  const r=rng(20261111),g=()=>{let u=0;for(let i=0;i<6;i++)u+=r();return (u-3)/Math.sqrt(.5);};
  const F=["price","carbon","saidi","wait","mw","vac","build","land","pue","peak","mem","pop"],R=["ai","reg","env","geo","soc","cn"];
  const sc=C.map(()=>[]),top3=C.map(()=>0);

      if(d.pue<1.03)d.pue=1.03;R.forEach(f=>d[f]=Math.min(5,Math.max(1,c[f]+.6*g())));return d;});

  return C.map((c,i)=>{const a=sc[i].sort((x,y)=>x-y);return {lo:a[Math.floor(runs*.05)],hi:a[Math.floor(runs*.95)],top3:top3[i]/runs};});

  res.forEach((x,i)=>{Object.assign(x,sim[i]);const c=x.c,why=[];let flag="go";
    RISKS.forEach(([k,e,z])=>{if(c[k]>=5){flag="no";why.push([e.toLowerCase()+" risk rated 5",z+"风险评为5"]);}});

const svg=$("#map"),NS="http://www.w3.org/2000/svg";let view={x:20,y:170,w:780,h:671},k0=1;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(parent)parent.appendChild(e);return e;}
function setView(){svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);k0=780/view.w;
  svg.querySelectorAll(".cityg").forEach(g=>g.setAttribute("transform",`translate(${g.dataset.x},${g.dataset.y}) scale(${1/k0})`));}
function zoomAt(f,cx,cy){const nw=Math.min(1000,Math.max(60,view.w*f)),r=nw/view.w;view.x=cx-(cx-view.x)*r;view.y=cy-(cy-view.y)*r;view.w=nw;view.h=nw*.86;setView();}
function svgPt(ev){const b=svg.getBoundingClientRect();return [view.x+(ev.clientX-b.left)/b.width*view.w,view.y+(ev.clientY-b.top)/b.height*view.h];}
function buildMap(){
  const base=el("g",{},svg);GEO.countries.forEach(c=>el("path",{class:"country",d:c.d},base));
  el("defs",{id:"defs"},svg);el("g",{id:"g-heat"},svg);el("g",{id:"g-links"},svg);el("g",{id:"g-cities"},svg);
  svg.addEventListener("wheel",ev=>{ev.preventDefault();const[x,y]=svgPt(ev);zoomAt(ev.deltaY>0?1.2:1/1.2,x,y);},{passive:false});
  let drag=null;svg.addEventListener("pointerdown",ev=>{drag={x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y,moved:false};});
  window.addEventListener("pointermove",ev=>{if(!drag)return;const b=svg.getBoundingClientRect(),dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4){drag.moved=true;svg.classList.add("drag");}
    if(drag.moved){view.x=drag.vx-dx/b.width*view.w;view.y=drag.vy-dy/b.height*view.h;setView();}});
  window.addEventListener("pointerup",()=>{if(drag&&drag.moved)setTimeout(()=>svg.classList.remove("drag"),0);drag=null;});
  $("#zin").onclick=()=>zoomAt(1/1.4,view.x+view.w/2,view.y+view.h/2);$("#zout").onclick=()=>zoomAt(1.4,view.x+view.w/2,view.y+view.h/2);
  $("#zreset").onclick=()=>{view={x:20,y:170,w:780,h:671};setView();};
}

  <li><b>Grid wait context</b>: 7–10 years in legacy hubs, 2–10 across the EU, short in the Nordics. ${A(U.iea,"IEA")}, ${A(U.em,"Ember")}, ${A(U.en,"Euronews")}. No source gives a per-city number, so every wait figure here is an estimate set inside those ranges.</li>
  <li><b>Capacity and vacancy</b>: London 1,380 MW and Amsterdam 927 MW from ${A(U.cw,"Cushman &amp; Wakefield H1 2026")}; FLAP-D vacancy from ${A(U.jll,"JLL Q2 2026")}; Milan 414 MW and Madrid 390 MW from ${A(U.ax,"Axis Intelligence")} citing Politecnico di Milano; Lisbon about 50 MW from ${A(U.cb,"CBRE")}. Frankfurt, Paris and Dublin are split from C&amp;W's 5.2 GW FLAP-D total. Sources disagree widely on city capacity.</li>

  <li><b>Population and AI ecosystem</b>: OECD 2020 metro areas via ${A(U.pop,"Wikipedia")}; ${A(U.dr,"Dealroom and Prosus, State of AI in Europe 2026")}; ${A(U.te,"Tech.eu")}.</li></ul>
  <h3>Estimates</h3><p class="note">Marked ≈ throughout: all grid wait times, PUE, risk ratings, AI ecosystem ratings, land cost outside FLAP-D, build cost for ten markets, capacity and vacancy for most emerging markets, and Madrid's IXP figures. The simulation gives these three times the uncertainty of published figures. The three scenario definitions (weights, project size, utilisation) are also assumptions. Replace them with broker or TSO data before relying on a ranking.</p>
  <h3>What the requirements ask for that this version does not do</h3><ul class="src">
  <li>Live feeds (ENTSO-E congestion, weather): a hosted page cannot call external APIs, so all data is a snapshot.</li>
  <li>Transmission lines, substations and real fibre routes; zoom stops at country outlines, not municipalities. The dashed links are schematic.</li>
  <li>Available MW per region, PPA and green-certificate prices, path-diversity analysis, company-level customer clustering.</li>
  <li>Logins, roles, encryption and the 500-user target, which belong to the production FastAPI and PostGIS build.</li></ul>`,
  `<h3>公开发布的数据</h3><ul class="src">

/* ---------- render ---------- */
function render(){
  const res=evaluate(S);if(!S.sel)S.sel=res[0].c.n;
  const sc=SCEN.find(s=>s.k===S.scen);
  if(sc&&(S.preset||S.mw!==sc.mw||S.util!==sc.util||S.maxWait!==sc.maxWait||CRIT.some(([k],i)=>S.w[k]!==sc.w[i]))){S.scen=null;document.querySelectorAll("#scens .chip").forEach(b=>b.setAttribute("aria-pressed","false"));}
  document.querySelectorAll("#presets .chip").forEach((b,i)=>b.setAttribute("aria-pressed",Object.keys(PRESETS)[i]===S.preset));
  drawVerdict(res);drawMap(res);drawRank(res);drawDetail(res);
  drawScen();drawCn(res);drawPower(res);drawNetwork(res);drawDemand(res);drawCost(res);
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.k===S.tab));
  document.querySelectorAll(".tabpane").forEach(p=>p.classList.toggle("on",p.id==="t-"+S.tab));
}
buildControls();buildMap();render();
</script>
