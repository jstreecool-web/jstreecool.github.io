*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:24px} h2{font-size:17px} h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1560px;margin:0 auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-start;justify-content:space-between}
header.top p{color:var(--ink2);max-width:75ch}
.topright{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.verdict{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 14px;font-size:15px}
.verdict b{font-weight:600}
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,600px);gap:14px;align-items:start}
@media (max-width:1380px){.grid{grid-template-columns:250px minmax(0,1fr)} .grid .rank{grid-column:1 / -1}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--ink2)} .small{font-size:12px} .faint{color:var(--ink3)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.ctl label{font-size:13px} .ctl output{text-align:right;font-weight:500;white-space:nowrap}
.ctl input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--accent);margin:0 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip:hover{border-color:var(--accent)}
a.chip{color:var(--ink);text-decoration:none}
a.chip[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.mapbox{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sea);touch-action:none}
.mapbox svg{display:block;width:100%;height:auto;cursor:grab;user-select:none}
.mapbox svg.drag{cursor:grabbing}
.country{fill:var(--land);stroke:var(--landline);stroke-width:.6;vector-effect:non-scaling-stroke}
.link{stroke:var(--s1);stroke-width:1.6;vector-effect:non-scaling-stroke;fill:none;opacity:.75;stroke-dasharray:5 3}
.citylabel{font:600 12px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.sublabel{font:500 10.5px var(--body);fill:var(--ink2);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.cityg{cursor:pointer}
.cityg.sel .ring{stroke:var(--ink);stroke-width:2.5}
.zoom{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:30px;height:30px;border:1px solid var(--line);background:var(--panel);border-radius:4px;font-size:16px;line-height:1}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);align-items:center}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ramp{display:inline-flex;vertical-align:-2px;margin:0 5px}.ramp i{width:16px;height:10px;display:block}
.layerdesc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px 16px;font-size:12.5px;color:var(--ink2)}
.layerdesc div{border-left:2px solid var(--line);padding-left:8px}
.layerdesc div.on{border-left-color:var(--accent)}
.layerdesc b{color:var(--ink);font-weight:600;display:block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--ink2);text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--accent-soft)} tbody tr.sel{background:var(--accent-soft)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.go{background:var(--good-bg);color:var(--good)} .pill.cond{background:var(--warn-bg);color:var(--warn)} .pill.no{background:var(--bad-bg);color:var(--bad)}
.est{color:var(--ink3);font-size:11px;margin-right:1px}
.scorebar{position:relative;height:14px;width:96px;background:var(--bg);border-radius:3px;display:inline-block;vertical-align:middle}
.scorebar i{position:absolute;left:0;top:2px;bottom:2px;background:var(--accent);border-radius:0 3px 3px 0}
.scorebar b{position:absolute;top:6px;height:2px;background:var(--ink)}
.scorebar b::before,.scorebar b::after{content:"";position:absolute;top:-3px;width:2px;height:8px;background:var(--ink)}
.scorebar b::before{left:0}.scorebar b::after{right:0}
.cellbar{display:inline-block;height:8px;border-radius:0 3px 3px 0;background:var(--s1);vertical-align:middle;margin-right:6px}
.mini{display:inline-flex;gap:2px;vertical-align:middle}
.mini span{width:22px;text-align:center;font-size:11px;border-radius:2px;padding:1px 0;color:var(--ink)}
#ranktable td,#ranktable th{padding-left:5px;padding-right:5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabpane{display:none;flex-direction:column;gap:12px}.tabpane.on{display:flex}
.note{font-size:12.5px;color:var(--ink2);max-width:95ch}
footer.credit{border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 24px;justify-content:space-between}
footer.credit p{margin:0;max-width:95ch} footer.credit a{color:var(--accent)}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv{border-left:2px solid var(--line);padding-left:8px}.kv>span{display:block;font-size:11.5px;color:var(--ink2)}.kv b{font-size:16px;font-weight:600}
.riskrow{display:flex;gap:10px;flex-wrap:wrap}
.tco{display:grid;grid-template-columns:96px minmax(0,1fr) 78px;gap:5px 8px;align-items:center;font-size:13px}
.tco .bar{display:flex;gap:2px;height:16px}
.tco .bar i{display:block;height:100%}
.tco .bar i:last-child{border-radius:0 4px 4px 0}
.heat td{text-align:center;padding:5px 6px;border:2px solid var(--panel)}
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.scard{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.scard.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.scard p{font-size:13px;color:var(--ink2)}
.scard ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.scard .asm{font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:8px}
.scell{display:inline-flex;gap:6px;align-items:center;justify-content:flex-end}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--panel);padding:7px 9px;border-radius:4px;font-size:12px;line-height:1.4;max-width:260px;z-index:9;display:none}
#tip b{font-weight:600}
ul.src{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;max-width:110ch}
a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.scorebar i,.tco .bar i{transition:width .25s}}
</style>
</head>

function drawDemand(res){
  const mp=Math.max(...C.map(c=>c.pop)),m10=Math.max(...C.map(c=>c.mw*Math.pow(1+(c.core?CAGR_CORE:CAGR_NEW),10)));
  $("#t-demand").innerHTML=`<p class="note">${L(`Demand combines resident population (2024 city statistics, rounded; Chongqing counts the main urban area), current capacity, vacancy and an AI ecosystem rating anchored on the 2025 China City AI Index (Tsinghua University and partners, April 2026), which names Beijing, Shanghai and Shenzhen among its leading cities. Hub capacity is standard racks × 2.5 kW, the MIIT definition of a standard rack. Forecasts grow core markets at ${fmt(CAGR_CORE*100,0)}% a year and hub clusters at ${fmt(CAGR_NEW*100,0)}%, consistent with Rystad's national rate of 13.4%.`,
   `需求综合了常住人口（2024年城市统计数据，取整；重庆仅计主城都市区）、现有容量、空置率，以及以《2025年中国城市人工智能指数报告》（清华大学等，2026年4月）为基准的AI生态评级，该报告把北京、上海、深圳列为领先城市。枢纽容量按标准机架数 × 2.5 kW（工信部标准机架定义）折算。预测中核心市场每年增长${fmt(CAGR_CORE*100,0)}%，枢纽集群每年增长${fmt(CAGR_NEW*100,0)}%，与Rystad全国年增长13.4%的预测一致。`)}</p>
  <div class="tablewrap"><table id="tb-dem"><thead><tr>${TH("Market","市场",1)}${TH("Population (m)","人口（百万）",1)}${TH("AI ecosystem (1–5)","AI生态（1–5）")}${TH("Vacancy","空置率")}${TH("Capacity today (MW)","当前容量（MW）")}${TH("In 5 years","5年后")}${TH("In 10 years (MW)","10年后（MW）",1)}${TH("Demand score","需求得分")}</tr></thead><tbody>`+
  res.slice().sort((a,b)=>b.s.demand-a.s.demand).map(r=>{const c=r.c,g=c.core?CAGR_CORE:CAGR_NEW,f5=c.mw*Math.pow(1+g,5),f10=c.mw*Math.pow(1+g,10);
   return `<tr data-n="${c.n}" class="${S.sel===c.n?"sel":""}"><td class="l"><b>${nm(c)}</b></td><td class="l">${bar(c.pop,mp,70,"var(--s3)")}${fmt(c.pop,1)}</td><td>${EST}${c.ai}</td>
   <td>${E(c,"vac")}${fmt(c.vac,1)}%</td><td>${E(c,"mw")}${fmt(c.mw)}</td><td>${EST}${fmt(f5)}</td><td class="l">${bar(f10,m10,70,"var(--s3)")}${EST}${fmt(f10)}</td><td><b>${fmt(r.s.demand,0)}</b></td></tr>`}).join("")+`</tbody></table></div>
  <p class="note">${L("Demand score = 30% AI ecosystem, 25% population, 25% market size, 20% vacancy tightness. Hub vacancy is 100% minus reported rack utilisation, several figures from 2023–24. A hub cluster's real customers are in the eastern cities it serves, so its own population understates demand for batch and training work.",
   "需求得分 = 30% AI生态 + 25% 人口 + 25% 市场规模 + 20% 空置率紧张度。枢纽空置率为100%减去公布的上架率，部分数据来自2023–2024年。枢纽集群的真实客户在其服务的东部城市，因此按本地人口计分会低估其离线计算和训练需求。")}</p>`;
  rowsel("#tb-dem");
}
function drawCost(res){
  const s=res.slice().sort((a,b)=>a.tco.total-b.tco.total),mx=s[s.length-1].tco.total;
  const parts=[["build",L("Build","建设"),"--s1"],["land",L("Powered land","带电土地"),"--s2"],["energy",L("Energy, 10 yrs","能源（10年）"),"--s3"],["other",L("Other opex, 10 yrs","其他运营（10年）"),"--s4"]];
  $("#t-cost").innerHTML=`<p class="note">${L(`10-year total cost of ownership for ${S.mw} MW of IT load at ${S.util}% utilisation, opex discounted at ${S.disc}%. Build cost uses Turner &amp; Townsend's 2026 index for Shanghai ($5.79 per watt) and estimates elsewhere: Hong Kong ranks 14th of 62 markets in the same index, which I set at $12.90. An 8.5% premium for high-density AI halls is added, converted at ${S.fx.toFixed(2)} EUR per USD.`,
   `${S.mw} MW IT负载、${S.util}%利用率下的10年总拥有成本，运营成本按${S.disc}%折现。建设成本在上海采用Turner &amp; Townsend 2026年指数（每瓦$5.79），其他市场为估算：香港在该指数62个市场中排第14，我按每瓦$12.90计。另加8.5%的高密度AI机房溢价，按1美元 = ${S.fx.toFixed(2)}欧元换算。`)}</p>
  <div class="legend">${parts.map(p=>`<span><span class="sw" style="background:var(${p[2]})"></span>${p[1]}</span>`).join("")}</div>
  <div class="tco">${s.map(r=>`<b>${nm(r.c)}</b><div class="bar" data-n="${r.c.n}">${parts.map(p=>`<i style="width:${r.tco[p[0]]/mx*100}%;background:var(${p[2]})"></i>`).join("")}</div><span style="text-align:right">${eur(r.tco.total)}</span>`).join("")}</div>
  <div class="tablewrap"><table id="tb-cost"><thead><tr>${TH("Market","市场",1)}${TH("Build ($/W)","建设（$/W）")}${TH("Land (€m/MW)","土地（百万€/MW）")}${TH("Capex","资本支出")}${TH("Energy per year","年能源成本")}${TH("10-yr TCO","10年TCO")}${TH("Levelised (€/kW/month)","平准化（€/kW/月）")}${TH("Cost score","成本得分")}</tr></thead><tbody>`+
  s.map(r=>{const c=r.c,t=r.tco;return `<tr data-n="${c.n}" class="${S.sel===c.n?"sel":""}"><td class="l"><b>${nm(c)}</b></td><td>${E(c,"build")}${c.build.toFixed(2)}</td><td>${E(c,"land")}${c.land.toFixed(2)}</td>
   <td>${eur(t.build+t.land)}</td><td>${eur(t.energyYr)}</td><td><b>${eur(t.total)}</b></td><td>${fmt(t.perKwMonth)}</td><td><b>${fmt(r.s.cost,0)}</b></td></tr>`}).join("")+`</tbody></table></div>
  <p class="note">${L("Levelised cost spreads capex over 10 years with no residual value, so it overstates the true cost of a 20-year asset. Hong Kong costs more than twice as much as any mainland site, and because scores are scaled between the cheapest and dearest market, mainland cost scores fall in a narrow band: a 40% cost gap between mainland sites moves the cost score by only about 20 points. Mainland land is leased use rights, not freehold. Revenue, tax, local subsidies and financing are not modelled.",
   "平准化成本按折现率把资本支出摊到10年且不计残值，因此会高估20年期资产的真实成本。香港的成本是任何内地站点的两倍以上，而得分按最便宜和最贵的市场线性缩放，因此内地各站点的成本得分挤在很窄的区间：内地站点之间40%的成本差距只对应约20分。内地土地为出让使用权而非永久产权。收入、税务、地方补贴和融资结构未建模。")}</p>`;
  $("#t-cost").querySelectorAll(".bar").forEach(b=>{const r=res.find(x=>x.c.n===b.dataset.n);
    b.addEventListener("pointermove",ev=>showTip(ev,`<b>${nm(r.c)}</b><br>`+parts.map(p=>`${p[1]}: ${eur(r.tco[p[0]])}`).join("<br>")+`<br><b>${L("Total","合计")} ${eur(r.tco.total)}</b>`));b.addEventListener("pointerleave",hideTip);b.onclick=()=>{S.sel=r.c.n;render();};});
  rowsel("#tb-cost");
}

  $("#t-sources").innerHTML=L(`<h3>Published figures</h3><ul class="src">

  <li><b>AI ecosystem</b>: ${A(U.ai,"2025 China City AI Index")}, Tsinghua University and partners. It groups cities into tiers rather than ranking them, so the 1–5 ratings are my estimates.</li></ul>
  <h3>Estimates</h3><p class="note">Marked ≈ throughout: all time-to-power figures, outage minutes outside Hong Kong, PUE outside Beijing and the hub rule, risk ratings, foreign-access ratings, AI ecosystem ratings, all land costs, build cost outside Shanghai, capacity for the core cities and for Chengdu, Chongqing and Ulanqab, mainland peak traffic, member counts of 3 where there is no public exchange, and the Inner Mongolia west, Gansu and Hong Kong power prices. The simulation gives these three times the uncertainty of published figures. Replace them with broker, grid-company or approval data before relying on a ranking.</p>
  <h3>What this version does not do</h3><ul class="src">

  <li>Logins, roles, encryption and the 500-user target, which belong to the production FastAPI and PostGIS build.</li></ul>`,
  `<h3>公开发布的数据</h3><ul class="src">
  <li><b>电价</b>：2025年5月1–10 kV两部制平段电价，来自${A(U.cb,"China Briefing")}；该表不含蒙西（和林格尔）和甘肃（庆阳），因此这两地电价为估算。香港按中电2026年${A(U.clp,"大量电费价目")}加${A(U.clpt,"燃料调整费")}、负荷率80%折算。欧元换算采用2026年11月12日的${A(U.ecb,"欧洲央行参考汇率")}。</li>
  <li><b>碳强度</b>：生态环境部、国家统计局2025年第47号公告发布的2023年省级电力平均二氧化碳排放因子，经${A(U.mee,"碳中和网")}汇总；香港数据来自${A(U.clpc,"中电")}（2024年）。</li>

  <li><b>交换中心</b>：PeeringDB成员数，经Internet Society Pulse查询${A(U.phk,"香港")}和${A(U.pcn,"中国内地")}；中卫时延和芜湖路由长度来自${A(U.cj,"《财经》")}。</li>

  <li><b>AI生态</b>：${A(U.ai,"《2025年中国城市人工智能指数报告》")}，清华大学等发布。该报告按梯队分组而非逐一排名，因此1–5评级为我的估算。</li></ul>
  <h3>估算值</h3><p class="note">全文以 ≈ 标注：全部获电时间、香港以外的停电分钟数、北京和枢纽规则以外的PUE、风险评级、外资准入评级、AI生态评级、全部土地成本、上海以外的建设成本、核心城市及成都、重庆、乌兰察布的容量、内地峰值流量、无公共交换中心城市的成员数3，以及蒙西、甘肃和香港的电价。模拟中这些估算值的不确定性是公开数据的三倍。在依据排名做决策前，请用经纪机构、电网公司或审批部门的数据替换它们。</p>

  <li>实时数据、输电线路、变电站和真实光纤路由；虚线连线为示意。香港圆点略微偏离真实位置（灰色小点为真实位置），以免遮挡深圳。</li>
  <li>各项目的能耗指标可得性、绿电价格、地方补贴和枢纽间带宽价格。</li>
  <li>登录、角色权限、加密和500并发用户目标，这些属于正式的FastAPI与PostGIS版本。</li></ul>`);
}

/* ---------- render ---------- */
function render(){
  const res=evaluate(S);if(!S.sel)S.sel=res[0].c.n;
  const sc=SCEN.find(s=>s.k===S.scen);
  if(sc&&(S.preset||S.mw!==sc.mw||S.util!==sc.util||S.maxWait!==sc.maxWait||CRIT.some(([k],i)=>S.w[k]!==sc.w[i]))){S.scen=null;document.querySelectorAll("#scens .chip").forEach(b=>b.setAttribute("aria-pressed","false"));}
  document.querySelectorAll("#presets .chip").forEach((b,i)=>b.setAttribute("aria-pressed",Object.keys(PRESETS)[i]===S.preset));
  drawVerdict(res);drawMap(res);drawRank(res);drawDetail(res);
  drawScen();drawCn(res);drawPower(res);drawNetwork(res);drawDemand(res);drawCost(res);
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.k===S.tab));
  document.querySelectorAll(".tabpane").forEach(p=>p.classList.toggle("on",p.id==="t-"+S.tab));
}
buildControls();buildMap();render();
